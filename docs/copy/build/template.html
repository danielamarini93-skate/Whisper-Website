<title>$pagetitle$</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: brand band on top, sticky page index on the left, copy column at reading width. Whisper UI Kit tokens. */
:root{
  --bg:#FFFFFF; --bg-alt:#F4F4F4; --surface:#FFFFFF; --line:#E2E2E2;
  --ink:#1B1B1B; --body:#3A3A3A; --muted:#5E5E5E;
  --teal-text:#0A6E71; --teal-soft:#E3F1F1; --focus:#0A6E71;
  --flag-bg:#FFF4D6; --flag-ink:#6B4A00; --flag-line:#E9C76B;
  --band-a:#2E2E2E; --band-b:#050505; --on-dark:#FFFFFF; --on-dark-muted:#C9C9C9; --hl-a:#2A9A9F; --hl-b:#8AF3F4; --red:#E52226;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212; --bg-alt:#1C1C1C; --surface:#181818; --line:#2E2E2E;
  --ink:#F2F2F2; --body:#D6D6D6; --muted:#A8A8A8;
  --teal-text:#6FD8DB; --teal-soft:#123334; --focus:#6FD8DB;
  --flag-bg:#3A2E0E; --flag-ink:#F6D98A; --flag-line:#7A6020; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121212; --bg-alt:#1C1C1C; --surface:#181818; --line:#2E2E2E;
  --ink:#F2F2F2; --body:#D6D6D6; --muted:#A8A8A8;
  --teal-text:#6FD8DB; --teal-soft:#123334; --focus:#6FD8DB;
  --flag-bg:#3A2E0E; --flag-ink:#F6D98A; --flag-line:#7A6020; color-scheme:dark }
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
body{background:var(--bg);color:var(--body);font:400 16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--teal-text);text-underline-offset:3px}
a:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1256px;margin:0 auto}

.band{background:linear-gradient(160deg,var(--band-a),var(--band-b));color:var(--on-dark)}
.band .wrap{padding-block:48px 40px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark-muted);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
.band h1{margin:0;font-weight:300;font-size:clamp(32px,5vw,52px);line-height:1.08;letter-spacing:-.025em;text-wrap:balance;color:var(--on-dark)}
.band h1 b{font-weight:500;background:linear-gradient(90deg,var(--hl-a),var(--hl-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:14px;color:var(--on-dark-muted)}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.4);color:var(--on-dark);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.pill:hover{background:#fff;color:#111}
.pill:focus-visible{outline-color:var(--hl-b)}
.count{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.count i{font-style:normal;display:inline-block;min-width:22px;padding:1px 8px;border-radius:999px;background:var(--flag-bg);color:var(--flag-ink);font-weight:600;font-size:13px;text-align:center}

.layout{display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;padding-block:40px 96px}
nav.toc{flex:1 1 240px;max-width:280px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);max-height:calc(100vh - 48px);overflow:auto}
nav.toc h2{font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
nav.toc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
nav.toc ul ul{display:none}
nav.toc a{display:block;padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--body);font-size:14px;line-height:1.35}
nav.toc a:hover{background:var(--bg-alt);color:var(--ink)}
details.toc-m{display:none}
main{flex:999 1 560px;min-width:0;max-width:760px}

main h1{display:none}
main h2{margin:72px 0 16px;padding-top:24px;border-top:1px solid var(--line);font-weight:300;font-size:32px;line-height:1.2;letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
main > h2:first-of-type{margin-top:0;border-top:0;padding-top:0}
main h3{margin:40px 0 10px;font-weight:500;font-size:20px;line-height:1.3;color:var(--ink);text-wrap:balance}
main h4{margin:28px 0 8px;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
main p,main li{max-width:68ch}
main p{margin:0 0 14px}
main ul,main ol{padding-left:22px;margin:0 0 16px}
main li{margin:4px 0}
main strong{color:var(--ink);font-weight:600}
main em{color:var(--ink)}
main blockquote{margin:16px 0;padding:12px 18px;background:var(--bg-alt);border-radius:12px;color:var(--ink)}
main code{font-family:var(--mono);font-size:.9em;background:var(--bg-alt);padding:1px 5px;border-radius:4px}
main hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.tbl{overflow-x:auto;margin:12px 0 24px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line)}
th{background:var(--bg-alt);color:var(--ink);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}
td{min-width:120px}
.flag{background:var(--flag-bg);color:var(--flag-ink);box-shadow:inset 0 -1px 0 var(--flag-line);padding:0 4px;border-radius:4px;font-size:.92em}
.top{display:inline-block;margin-top:48px;font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}

@media (max-width:900px){
  nav.toc{display:none}
  details.toc-m{display:block;flex:1 1 100%;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  details.toc-m summary{cursor:pointer;min-height:48px;display:flex;align-items:center;padding:0 16px;font-weight:500;color:var(--ink)}
  details.toc-m ul{list-style:none;margin:0;padding:0 8px 8px}
  details.toc-m ul ul{display:none}
  details.toc-m a{display:block;padding:10px 8px;text-decoration:none;color:var(--body);font-size:15px}
  .layout{gap:24px;padding-block:24px 64px}
  main h2{font-size:26px;margin-top:56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="band gut">
  <div class="wrap">
    <div class="eyebrow">$eyebrow$</div>
    <h1>$headline$</h1>
    <div class="meta">
      <span>$byline$</span>
      <span class="count"><i>$flagcount$</i> $flaglabel$</span>
      <a class="pill" href="$otherurl$" target="_blank" rel="noopener" lang="$otherlang$">$otherlabel$</a>
    </div>
  </div>
</header>

<div class="gut"><div class="wrap layout">
  <nav class="toc" aria-label="$toclabel$"><h2>$toclabel$</h2>$toc$</nav>
  <details class="toc-m"><summary>$toclabel$</summary>$toc$</details>
  <main id="top">
$body$
  <a class="top" href="#top">$toplabel$ ↑</a>
  </main>
</div></div>
