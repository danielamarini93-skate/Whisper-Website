</svg>

</div>

<svg class="wh-icon wh-alert__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

</path>
<path d="M12 17h.01">
</path>
</svg>
<div>
<p class="wh-alert__title">Two fields need your attention</p>
<p class="wh-alert__text">Check your email address and group size.</p>
</div>
</div>
</div>
</div>
