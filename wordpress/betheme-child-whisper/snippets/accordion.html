<!-- Whisper UI Kit · accordion
     FAQ accordion. Needs whisper-kit.js. Give each accordion on a page its own id prefix (search “faq-”).
     Paste into a BeBuilder HTML element (or a template). Requires whisper-kit.css (loaded by the child theme).
     Images point to the child theme's assets/img folder; replace href="#" with real links. -->
<div class="wh-page">
<div class="wh-acc">
<div class="wh-acc__item is-open">
<h3 class="wh-acc__h">
<button type="button" class="wh-acc__btn" aria-expanded="true" aria-controls="wh-acc-0-faq">
<span>How many listeners can one transmitter reach?</span>
<svg class="wh-icon wh-acc__chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<path d="m6 9 6 6 6-6">
</path>
</svg>
</button>
</h3>
<div id="wh-acc-0-faq" class="wh-acc__panel">
<p>There is no limit: every Whisper receiver in range tunes to the guide's channel automatically.</p>
</div>
</div>
<div class="wh-acc__item">
<h3 class="wh-acc__h">
<button type="button" class="wh-acc__btn" aria-expanded="false" aria-controls="wh-acc-1-faq">
<span>Can I rent instead of buying?</span>
<svg class="wh-icon wh-acc__chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<path d="m6 9 6 6 6-6">
</path>
</svg>
</button>
</h3>
<div id="wh-acc-1-faq" class="wh-acc__panel" hidden="">
<p>Yes. Rental kits ship in 48 hours across Europe, with chargers and cases included.</p>
</div>
</div>
<div class="wh-acc__item">
<h3 class="wh-acc__h">
<button type="button" class="wh-acc__btn" aria-expanded="false" aria-controls="wh-acc-2-faq">
<span>Does Whisper T need an app?</span>
<svg class="wh-icon wh-acc__chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<path d="m6 9 6 6 6-6">
</path>
</svg>
</button>
</h3>
<div id="wh-acc-2-faq" class="wh-acc__panel" hidden="">
<p>No. Listeners use a standard Whisper receiver and choose their language on the device.</p>
</div>
</div>
</div>
</div>
