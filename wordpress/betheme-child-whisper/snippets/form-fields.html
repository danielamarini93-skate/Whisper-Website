<!-- Whisper UI Kit · form-fields
     Static form layout for reference. For live forms use Contact Form 7: the adapter styles its fields to match.
     Paste into a BeBuilder HTML element (or a template). Requires whisper-kit.css (loaded by the child theme).
     Images point to the child theme's assets/img folder; replace href="#" with real links. -->
<div class="wh-page">
<div style="display: grid; gap: 20px; max-width: 560px;">
<fieldset class="wh-radiocards">
<legend class="wh-field__label">How do you want your Whisper?</legend>
<div class="wh-radiocards__grid">
<label class="wh-radiocard is-checked">
<input type="radio" name="wh-how" value="rent" checked="">
<span class="wh-radiocard__icon">
<svg class="wh-icon wh-icon--grad" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="url(#wh-ig-form-fields-82)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<defs>
<linearGradient id="wh-ig-form-fields-82" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22">
<stop offset="0" style="stop-color: var(--wh-grad-a);">
</stop>
<stop offset="1" style="stop-color: var(--wh-grad-b);">
</stop>
</linearGradient>
</defs>
<path d="M8 2v4">
</path>
<path d="M16 2v4">
</path>
<path d="M3 10h18">
</path>
<rect width="18" height="18" x="3" y="4" rx="2">
</rect>
</svg>
</span>
<span class="wh-radiocard__title">Rent</span>
<span class="wh-radiocard__meta">From 1 day, delivered</span>
<span class="wh-radiocard__tick" aria-hidden="true">
<svg class="wh-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<path d="M20 6 9 17l-5-5">
</path>
</svg>
</span>
</label>
<label class="wh-radiocard">
<input type="radio" name="wh-how" value="buy">
<span class="wh-radiocard__icon">
<svg class="wh-icon wh-icon--grad" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="url(#wh-ig-form-fields-84)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<defs>
<linearGradient id="wh-ig-form-fields-84" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22">
<stop offset="0" style="stop-color: var(--wh-grad-a);">
</stop>
<stop offset="1" style="stop-color: var(--wh-grad-b);">
</stop>
</linearGradient>
</defs>
<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z">
</path>
<path d="m9 12 2 2 4-4">
</path>
</svg>
</span>
<span class="wh-radiocard__title">Buy</span>
<span class="wh-radiocard__meta">Own the system, 2-year warranty</span>
<span class="wh-radiocard__tick" aria-hidden="true">
<svg class="wh-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<path d="M20 6 9 17l-5-5">
</path>
</svg>
</span>
</label>
<label class="wh-radiocard">
<input type="radio" name="wh-how" value="demo">
<span class="wh-radiocard__icon">
<svg class="wh-icon wh-icon--grad" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="url(#wh-ig-form-fields-86)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<defs>
<linearGradient id="wh-ig-form-fields-86" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22">
<stop offset="0" style="stop-color: var(--wh-grad-a);">
</stop>
<stop offset="1" style="stop-color: var(--wh-grad-b);">
</stop>
</linearGradient>
</defs>
<path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z">
</path>
<path d="M21 16v2a4 4 0 0 1-4 4h-5">
</path>
</svg>
</span>
<span class="wh-radiocard__title">Book a demo</span>
<span class="wh-radiocard__meta">30 minutes, online</span>
<span class="wh-radiocard__tick" aria-hidden="true">
<svg class="wh-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<path d="M20 6 9 17l-5-5">
</path>
</svg>
</span>
</label>
</div>
</fieldset>
<div class="wh-field">
<label class="wh-field__label" for="wh-email">Email<span class="wh-field__req" aria-hidden="true"> *</span>
</label>
<input id="wh-email" class="wh-input" type="email" placeholder="name@company.com" required="" aria-describedby="wh-email-msg" value="">
<p class="wh-field__msg" id="wh-email-msg">We reply within one working day.</p>
</div>
<div class="wh-field">
<label class="wh-field__label" for="wh-size">Group size<span class="wh-field__req" aria-hidden="true"> *</span>
</label>
<div class="wh-select">
<select id="wh-size" class="wh-input" required="">
<option value="" disabled="" selected="">Choose a group size</option>
<option value="Up to 25 people">Up to 25 people</option>
<option value="26 to 50 people">26 to 50 people</option>
<option value="51 to 100 people">51 to 100 people</option>
<option value="More than 100">More than 100</option>
</select>
<svg class="wh-icon wh-select__chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<path d="m6 9 6 6 6-6">
</path>
</svg>
</div>
</div>
<div class="wh-field">
<label class="wh-field__label" for="wh-msg">Tell us about your tours</label>
<textarea id="wh-msg" class="wh-input" placeholder="Group size, dates, languages" rows="4">
</textarea>
</div>
<label class="wh-check" for="wh-consent">
<input id="wh-consent" type="checkbox">
<span class="wh-check__box" aria-hidden="true">
<svg class="wh-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<path d="M20 6 9 17l-5-5">
</path>
</svg>
</span>
<span class="wh-check__label">I agree to the privacy policy</span>
</label>
<button class="wh-btn wh-btn--primary wh-btn--md" type="submit">
<span class="wh-btn__label">Request a quote</span>
<svg class="wh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<path d="M5 12h14">
</path>
<path d="m12 5 7 7-7 7">
</path>
</svg>
</button>
</div>
</div>
